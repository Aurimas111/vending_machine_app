# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name iamaurimas.xyz;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name iamaurimas.xyz;

    ssl_certificate /etc/letsencrypt/live/iamaurimas.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iamaurimas.xyz/privkey.pem;

    # Security (optional but recommended)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;


    # Serve React frontend (static files)
    location /vendingmachine/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /vendingmachine/index.html;
    }

    # Proxy API calls to Spring Boot backend
    location /vendingmachine/api/ {
        proxy_pass http://localhost:8080/api/;  # Assumes backend runs on host:8080
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
